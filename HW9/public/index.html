<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cloud Native Todo & Notes App - 部署於 Cloudflare Pages 的雲端待辦事項與筆記管理工具" />
  <title>Cloud Tasks | 雲端待辦與筆記</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: rgba(30, 41, 59, 0.72);
      --surface-solid: #1e293b;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --accent: #a78bfa;
      --success: #34d399;
      --danger: #f87171;
      --radius: 18px;
      --shadow: 0 20px 45px -20px rgba(2, 6, 23, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(56, 189, 248, 0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.16), transparent 55%),
        linear-gradient(160deg, #0b1120 0%, #0f172a 45%, #111c33 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 18px 64px;
    }

    .app {
      width: min(980px, 100%);
      display: grid;
      gap: 22px;
    }

    header.hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      font-size: 26px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 26px -8px rgba(56, 189, 248, 0.7);
    }

    .brand h1 {
      font-size: clamp(1.25rem, 2.4vw, 1.7rem);
      letter-spacing: 0.4px;
    }

    .brand p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
    }

    .status-pill.online .dot { background: var(--success); animation: pulse 2s infinite; }
    .status-pill.offline .dot { background: var(--danger); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
      70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 24px;
    }

    .card h2 {
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .card h2 .badge {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }

    form.todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .todo-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px 16px;
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .todo-form input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, filter 0.2s, background 0.2s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #05202e;
      background: linear-gradient(135deg, var(--primary), #7dd3fc);
      border-radius: 12px;
      box-shadow: 0 10px 22px -10px rgba(56, 189, 248, 0.85);
    }

    .btn-primary:hover { filter: brightness(1.08); }

    .btn-ghost {
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .btn-ghost:hover { color: var(--text); background: rgba(148, 163, 184, 0.18); }

    ul.todo-list {
      list-style: none;
      display: grid;
      gap: 10px;
      max-height: 44vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    ul.todo-list::-webkit-scrollbar { width: 7px; }
    ul.todo-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28);
      border-radius: 99px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 13px;
      animation: slide-in 0.25s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done { opacity: 0.55; }

    .check {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid rgba(148, 163, 184, 0.55);
      background: transparent;
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 0.75rem;
    }

    .todo-item.done .check {
      border-color: var(--success);
      background: var(--success);
      color: #04231a;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      font-size: 0.94rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-time {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .icon-btn {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
    }

    .icon-btn:hover { color: var(--danger); background: rgba(248, 113, 113, 0.12); }

    .empty {
      text-align: center;
      padding: 34px 12px;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed var(--border);
      border-radius: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      text-align: center;
      padding: 14px 8px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat span { font-size: 0.72rem; color: var(--muted); }

    .info-block {
      display: grid;
      gap: 9px;
      font-size: 0.82rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 13px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .info-row .label { color: var(--muted); flex: 0 0 auto; }
    .info-row .value {
      text-align: right;
      word-break: break-all;
      font-variant-numeric: tabular-nums;
    }

    .info-row .value.mono { font-family: "Consolas", "SFMono-Regular", monospace; font-size: 0.76rem; }

    .loading { color: var(--muted); font-size: 0.82rem; }
    .error-text { color: var(--danger); font-size: 0.82rem; line-height: 1.5; }

    footer {
      margin-top: 34px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.7;
    }

    footer a { color: var(--primary); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 22px);
      padding: 12px 20px;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 50;
      max-width: calc(100vw - 36px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 18px 14px 48px; }
      header.hero { padding: 20px; }
      .card { padding: 19px; }
      ul.todo-list { max-height: none; }
    }

    @media (max-width: 480px) {
      .brand .logo { width: 44px; height: 44px; font-size: 22px; }
      form.todo-form { flex-direction: column; }
      .btn-primary { justify-content: center; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .stat strong { font-size: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="brand">
        <div class="logo" aria-hidden="true">☁️</div>
        <div>
          <h1>Cloud Tasks</h1>
          <p>雲端待辦事項與筆記管理工具 · Cloudflare Pages</p>
        </div>
      </div>
      <div class="status-pill" id="apiStatus" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="apiStatusText">檢查 API 連線中…</span>
      </div>
    </header>

    <main class="grid">
      <section class="card" aria-labelledby="todoHeading">
        <h2 id="todoHeading">
          <span aria-hidden="true">📝</span> 待辦清單
          <span class="badge" id="listBadge">0 項</span>
        </h2>

        <form class="todo-form" id="todoForm" autocomplete="off">
          <label for="todoInput" class="sr-only" hidden>新增待辦事項</label>
          <input
            type="text"
            id="todoInput"
            name="todo"
            placeholder="輸入新的待辦事項，按 Enter 或點擊新增…"
            maxlength="200"
            required
          />
          <button type="submit" class="btn-primary">
            <span aria-hidden="true">＋</span> 新增
          </button>
        </form>

        <div class="stats" aria-label="統計">
          <div class="stat"><strong id="statTotal">0</strong><span>總計</span></div>
          <div class="stat"><strong id="statActive">0</strong><span>未完成</span></div>
          <div class="stat"><strong id="statDone">0</strong><span>已完成</span></div>
        </div>

        <ul class="todo-list" id="todoList" aria-live="polite"></ul>
        <div class="empty" id="emptyState" hidden>
          目前沒有待辦事項，先新增一筆吧！
        </div>

        <div style="display:flex; justify-content:flex-end; margin-top:16px; gap:8px;">
          <button type="button" class="btn-ghost" id="clearDoneBtn">清除已完成</button>
          <button type="button" class="btn-ghost" id="clearAllBtn">清空全部</button>
        </div>
      </section>

      <aside class="card" aria-labelledby="infoHeading">
        <h2 id="infoHeading"><span aria-hidden="true">🛰️</span> 伺服器資訊</h2>
        <div id="infoContent" class="info-block">
          <p class="loading">正在向 <code>/api/info</code> 取得部署資訊…</p>
        </div>
        <div style="margin-top:16px;">
          <button type="button" class="btn-ghost" id="refreshInfoBtn">↻ 重新整理資訊</button>
        </div>
      </aside>
    </main>

    <footer>
      <p>資料儲存於瀏覽器 LocalStorage（本機優先），並透過 <code>/api/info</code> 與後端互動。</p>
      <p>第 9 週作業 · Powered by <a href="https://pages.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Pages</a></p>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "cloud-tasks:v1";
      var API_ENDPOINT = "/api/info";

      var els = {
        form: document.getElementById("todoForm"),
        input: document.getElementById("todoInput"),
        list: document.getElementById("todoList"),
        empty: document.getElementById("emptyState"),
        badge: document.getElementById("listBadge"),
        statTotal: document.getElementById("statTotal"),
        statActive: document.getElementById("statActive"),
        statDone: document.getElementById("statDone"),
        clearDone: document.getElementById("clearDoneBtn"),
        clearAll: document.getElementById("clearAllBtn"),
        refreshInfo: document.getElementById("refreshInfoBtn"),
        infoContent: document.getElementById("infoContent"),
        apiStatus: document.getElementById("apiStatus"),
        apiStatusText: document.getElementById("apiStatusText"),
        toast: document.getElementById("toast")
      };

      var todos = loadTodos();
      var toastTimer = null;

      function loadTodos() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(function (item) {
            return item && typeof item.text === "string" && typeof item.id === "string";
          }).map(function (item) {
            return {
              id: item.id,
              text: item.text,
              done: Boolean(item.done),
              createdAt: typeof item.createdAt === "string" ? item.createdAt : new Date().toISOString()
            };
          });
        } catch (err) {
          console.warn("無法讀取 LocalStorage，使用空清單。", err);
          return [];
        }
      }

      function saveTodos() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
          return true;
        } catch (err) {
          console.warn("無法寫入 LocalStorage。", err);
          showToast("⚠️ LocalStorage 寫入失敗，資料可能無法保存。");
          return false;
        }
      }

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return "t-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      }

      function formatTime(iso) {
        try {
          return new Date(iso).toLocaleString("zh-TW", {
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit"
          });
        } catch (e) {
          return "";
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function render() {
        els.list.innerHTML = "";
        todos.forEach(function (todo) {
          els.list.appendChild(createItem(todo));
        });

        var total = todos.length;
        var done = todos.filter(function (t) { return t.done; }).length;
        var active = total - done;

        els.statTotal.textContent = String(total);
        els.statActive.textContent = String(active);
        els.statDone.textContent = String(done);
        els.badge.textContent = total + " 項";
        els.empty.hidden = total !== 0;
        els.list.hidden = total === 0;
      }

      function createItem(todo) {
        var li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");
        li.dataset.id = todo.id;

        var check = document.createElement("button");
        check.type = "button";
        check.className = "check";
        check.setAttribute("role", "checkbox");
        check.setAttribute("aria-checked", todo.done ? "true" : "false");
        check.setAttribute("aria-label", todo.done ? "標記為未完成" : "標記為已完成");
        check.textContent = "✓";
        check.addEventListener("click", function () {
          toggleTodo(todo.id);
        });

        var textWrap = document.createElement("div");
        textWrap.className = "todo-text";
        textWrap.textContent = todo.text;

        var time = document.createElement("span");
        time.className = "todo-time";
        time.textContent = "建立於 " + formatTime(todo.createdAt);
        textWrap.appendChild(time);

        var del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn";
        del.setAttribute("aria-label", "刪除待辦事項");
        del.title = "刪除";
        del.textContent = "🗑";
        del.addEventListener("click", function () {
          deleteTodo(todo.id);
        });

        li.appendChild(check);
        li.appendChild(textWrap);
        li.appendChild(del);
        return li;
      }

      function addTodo(text) {
        var trimmed = text.trim();
        if (!trimmed) return;
        todos.unshift({
          id: makeId(),
          text: trimmed.slice(0, 200),
          done: false,
          createdAt: new Date().toISOString()
        });
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        todo.done = !todo.done;
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter(function (t) { return t.id !== id; });
        saveTodos();
        render();
        showToast("已刪除 1 筆待辦事項");
      }

      function clearDone() {
        var before = todos.length;
        todos = todos.filter(function (t) { return !t.done; });
        var removed = before - todos.length;
        if (removed === 0) {
          showToast("目前沒有已完成的項目");
          return;
        }
        saveTodos();
        render();
        showToast("已清除 " + removed + " 筆已完成項目");
      }

      function clearAll() {
        if (todos.length === 0) {
          showToast("清單已經是空的");
          return;
        }
        if (!window.confirm("確定要清空全部待辦事項嗎？此動作無法復原。")) return;
        todos = [];
        saveTodos();
        render();
        showToast("已清空全部待辦事項");
      }

      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          els.toast.classList.remove("show");
        }, 2400);
      }

      function setApiStatus(online, text) {
        els.apiStatus.classList.toggle("online", online === true);
        els.apiStatus.classList.toggle("offline", online === false);
        els.apiStatusText.textContent = text;
      }

      function infoRow(label, value, mono) {
        var row = document.createElement("div");
        row.className = "info-row";

        var l = document.createElement("span");
        l.className = "label";
        l.textContent = label;

        var v = document.createElement("span");
        v.className = "value" + (mono ? " mono" : "");
        v.textContent = value;

        row.appendChild(l);
        row.appendChild(v);
        return row;
      }

      function renderInfo(data) {
        els.infoContent.innerHTML = "";
        els.infoContent.appendChild(infoRow("訊息", String(data.message || "OK")));
        els.infoContent.appendChild(infoRow("環境", String(data.environment || "unknown")));
        els.infoContent.appendChild(infoRow("地區", String(data.colo || "N/A")));
        els.infoContent.appendChild(infoRow("執行時間", String(data.responseTimeMs != null ? data.responseTimeMs + " ms" : "N/A")));
        els.infoContent.appendChild(infoRow("伺服器時間", String(data.serverTime || "N/A"), true));
        els.infoContent.appendChild(infoRow("時區", String(data.timeZone || "N/A")));
        els.infoContent.appendChild(infoRow("執行 ID", String(data.requestId || "N/A"), true));
        els.infoContent.appendChild(infoRow("路徑", String(data.path || "/api/info"), true));
      }

      function renderInfoError(message) {
        els.infoContent.innerHTML = "";
        var p = document.createElement("p");
        p.className = "error-text";
        p.textContent = "⚠️ " + message;
        els.infoContent.appendChild(p);

        var retry = document.createElement("button");
        retry.type = "button";
        retry.className = "btn-ghost";
        retry.textContent = "重試";
        retry.style.marginTop = "12px";
        retry.addEventListener("click", fetchInfo);
        els.infoContent.appendChild(retry);
      }

      function fetchInfo() {
        els.infoContent.innerHTML = '<p class="loading">正在向 /api/info 取得部署資訊…</p>';
        setApiStatus(null, "檢查 API 連線中…");

        var started = performance.now();
        var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timeoutId = controller ? setTimeout(function () { controller.abort(); }, 8000) : null;

        fetch(API_ENDPOINT, {
          method: "GET",
          headers: { "Accept": "application/json" },
          signal: controller ? controller.signal : undefined,
          cache: "no-store"
        })
          .then(function (res) {
            if (!res.ok) {
              throw new Error("API 回應狀態 " + res.status + " " + res.statusText);
            }
            return res.json();
          })
          .then(function (data) {
            var elapsed = Math.round(performance.now() - started);
            renderInfo(data || {});
            setApiStatus(true, "API 已連線 · " + elapsed + " ms");
          })
          .catch(function (err) {
            if (err && err.name === "AbortError") {
              setApiStatus(false, "API 逾時");
              renderInfoError("連線逾時（8 秒），請確認 Pages Functions 是否正常運作。");
              return;
            }
            setApiStatus(false, "API 離線");
            renderInfoError(
              "無法取得伺服器資訊：" + (err && err.message ? err.message : "未知錯誤") +
              "。若在本機測試，請改用 `npx wrangler pages dev public` 啟動。"
            );
          })
          .finally(function () {
            if (timeoutId) clearTimeout(timeoutId);
          });
      }

      els.form.addEventListener("submit", function (event) {
        event.preventDefault();
        addTodo(els.input.value);
        els.input.value = "";
        els.input.focus();
      });

      els.clearDone.addEventListener("click", clearDone);
      els.clearAll.addEventListener("click", clearAll);
      els.refreshInfo.addEventListener("click", fetchInfo);

      window.addEventListener("storage", function (event) {
        if (event.key === STORAGE_KEY) {
          todos = loadTodos();
          render();
          showToast("清單已由其他分頁同步更新");
        }
      });

      render();
      fetchInfo();
    })();
  </script>
</body>
</html>
